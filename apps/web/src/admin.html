<!-- standalone -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' https: data: http://localhost:4100 http://127.0.0.1:4100; connect-src https://tablamigo-api.hookstep.in http://localhost:4100 http://127.0.0.1:4100; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Tablamigo Admin</title>
<link rel="icon" href="/favicon.png">
<style>
:root{
  --coral:#FF5A36;--coral-d:#E4461F;--teal:#10B39F;--teal-t:#0A7C6E;--teal-bg:#E7F7F4;
  --bg:#F7F7F5;--card:#FFFFFF;--line:#E8E8E3;--rule:#F0F0EC;--ink:#1D1D1B;--body:#4A4A46;--muted:#6E6E68;
  --amber:#8A5A00;--amber-bg:#FFF4DB;--red:#B42318;--red-bg:#FDECEA;--grey-bg:#F1F1EE;
  --r:12px;--shadow:0 1px 2px rgba(20,20,18,.04),0 2px 8px rgba(20,20,18,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--teal-t)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.brand img{width:28px;height:28px;border-radius:7px}
.brand small{font-weight:600;color:var(--muted);font-size:13px;border-left:1px solid var(--line);padding-left:10px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs{max-width:1280px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:10px 12px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--coral)}
.count{background:var(--coral);color:#fff;border-radius:999px;font-size:11px;line-height:18px;padding:0 6px;font-weight:700}
main{max-width:1280px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:20px;line-height:28px;margin:0 0 16px;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-bottom:12px}
.kpi .v{font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .s{color:var(--muted);font-size:12.5px;margin-top:4px}
.two{grid-template-columns:2fr 1fr}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:180px}
input[type=search],input[type=email],input[type=text],input[type=number],select{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:36px;outline:none;max-width:100%}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(16,179,159,.15)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;min-height:34px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--grey-bg)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.primary:hover{background:var(--coral-d)}
.btn.teal{color:var(--teal-t);border-color:#BFE8E1}
.btn.teal:hover{background:var(--teal-bg)}
.btn.danger{color:var(--red);border-color:#F5C6C0}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{padding:4px 9px;min-height:28px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FCFCFA}
td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#FBFBF9}
.num{text-align:right;font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.person{display:flex;gap:10px;align-items:center;min-width:180px}
.av{width:32px;height:32px;border-radius:50%;background:var(--teal-bg);color:var(--teal-t);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;object-fit:cover}
.lightbox{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(20,20,18,.78);padding:24px}
.lightbox figure{margin:0;max-width:min(92vw,720px);text-align:center;color:#fff}
.lightbox img{max-width:100%;max-height:80vh;border-radius:12px;display:block;margin:0 auto}
.lightbox .nophoto{background:var(--card);color:var(--muted);padding:40px 56px;border-radius:12px;font-weight:600}
.lightbox figcaption{margin-top:10px;font-weight:600}
.person b{display:block;font-weight:600;line-height:1.3}
.person span{display:block;color:var(--muted);font-size:12.5px;line-height:1.3;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;line-height:20px;white-space:nowrap;background:var(--grey-bg);color:var(--body)}
.pill.teal{background:var(--teal-bg);color:var(--teal-t)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.coral{background:#FFE9E3;color:#B8340F}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.split{display:flex;flex-direction:column;gap:8px}
.split .row{display:flex;justify-content:space-between;gap:8px}
a.drill,a.ulink,a.plink{color:inherit;text-decoration:none}
a.drill:hover,a.ulink:hover b,a.plink:hover{text-decoration:underline;color:var(--teal, #0E9383)}
a.drill{border-bottom:1px dotted currentColor}
.kpi a.drill{border-bottom:0}
.lede{margin:-8px 0 16px;max-width:none;white-space:normal;overflow-wrap:anywhere}
.meter{height:6px;border-radius:3px;background:var(--grey-bg);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--teal)}
.note{background:var(--amber-bg);color:var(--amber);border-radius:8px;padding:8px 12px;font-size:12.5px}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.vgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.pair figure{margin:0}
.pair img,.pair .noimg{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--grey-bg);display:block}
.pair .noimg{display:grid;place-items:center;color:var(--muted);font-size:12.5px}
.pair figcaption{font-size:12px;color:var(--muted);margin-top:4px;text-align:center}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(20,20,18,.28)}
.drawer .panel{width:min(560px,100%);height:100%;overflow:auto;background:var(--bg);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08)}
.drawer .head{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;gap:12px;align-items:center;z-index:1}
.drawer .body{padding:16px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:calc(100% - 32px)}
.toast.err{background:var(--red)}
.login{max-width:400px;margin:10vh auto;padding:0 16px}
.login .card{padding:28px}
.login h1{margin-bottom:6px}
.login label{display:block;font-weight:600;margin:16px 0 6px}
.login input{width:100%;font-size:16px}
.login .btn{width:100%;justify-content:center;margin-top:14px;min-height:42px}
.err-text{color:var(--red);font-size:13px;margin-top:10px;min-height:1em}
.skeleton{color:var(--muted);padding:24px 0}
.journey-timeline{display:flex;flex-direction:column;gap:10px;position:relative;padding-left:8px;margin-top:10px}
.journey-timeline::before{content:'';position:absolute;left:21px;top:10px;bottom:10px;width:2px;background:var(--line);z-index:0}
.journey-item{display:flex;gap:12px;align-items:flex-start;position:relative;z-index:1}
.journey-icon{width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.journey-content{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;flex:1;min-width:0}
.journey-header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.journey-sub{margin-top:2px}
@media (max-width:768px){
  .bar{flex-wrap:wrap;padding:10px 12px;gap:8px}
  .who{width:100%;justify-content:flex-end}
  .toolbar{gap:6px}
  .toolbar .grow{min-width:140px}
  .drawer .panel{width:100%;border-left:none}
  .drawer .head{padding:10px 12px}
  .drawer .body{padding:12px}
  .pair{grid-template-columns:1fr}
}
/* Phones and tablets: Safari zooms into any field under 16px when it is tapped and stays zoomed. */
/* (Textareas get their font from the rule at the top, never inline: an inline font:inherit beat this and left them at 14px.)
   Buttons are at least 44px tall on touch screens, the smallest target a finger hits reliably (Sign out was 28).
   So are the section tabs (41), the search, filter and number fields (36) and the login button (42). input[type] matches the
   specificity of the base field rule above, which a bare input would lose to. */
@media (pointer:coarse){input,select,textarea{font-size:16px}.btn,.btn.sm{min-height:44px}nav.tabs a,input[type],select,.login .btn{min-height:44px}}
@media (max-width:640px){
  .brand small{display:none}
  .who span{display:none}
  .who{width:auto;margin-left:auto}
  /* Tables with a header row become one card per row, each cell labelled with its column (labelTables() below). */
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%;box-sizing:border-box}
  table.stack tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  table.stack tr:last-child{border-bottom:0}
  /* Label floated left, the cell's own content (often several inline parts) flows to its right as one piece. */
  table.stack td{padding:3px 0;border:0;text-align:right;overflow-wrap:break-word}
  table.stack td::after{content:"";display:table;clear:both}
  table.stack td::before{content:attr(data-label);float:left;margin-right:12px;color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:left;line-height:20px}
  table.stack td:first-child{text-align:left;padding-bottom:6px}
  table.stack td:first-child::before,table.stack td[data-label=""]::before{display:none}
  table.stack td:empty{display:none}
  main{padding:12px 12px 48px}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  .kpis{grid-template-columns:1fr 1fr}
}
</style>

</head>
<body>

<div id="login" class="login hidden">
  <div class="brand" style="margin-bottom:16px"><img src="/icon-192.png" alt="">Tablamigo <small>Admin</small></div>
  <div class="card">
    <h1>Sign in</h1>
    <p class="muted" style="margin:0">Admin access only. If this email belongs to an admin, we'll send it a 6-digit code.</p>
    <form id="f-email">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <button class="btn primary" type="submit">Send code</button>
    </form>
    <form id="f-code" class="hidden">
      <label for="code">If <span id="code-to"></span> is an admin, a code is on its way</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}" maxlength="6" required>
      <button class="btn primary" type="submit">Sign in</button>
      <button class="btn" type="button" id="code-back">Use a different email</button>
    </form>
    <div class="err-text" id="login-err" role="alert"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="bar">
      <a class="brand" href="#overview"><img src="/icon-192.png" alt="">Tablamigo <small>Admin</small></a>
      <div class="who"><span id="me"></span><button class="btn sm" id="signout">Sign out</button></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>
<div id="drawer"></div>

<script>
'use strict';
// ---- setup ----------------------------------------------------------------------------------------
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const API = (() => {
  // Only a locally served copy may point elsewhere, and only at a local API (never a link-supplied host).
  const q = new URLSearchParams(location.search).get('api');
  if (LOCAL && q && /^http:\/\/(localhost|127\.0\.0\.1):\d+$/.test(q)) return q;
  return LOCAL ? 'http://localhost:4100' : 'https://tablamigo-api.hookstep.in';
})();
// localStorage, so the session outlives the tab and lasts as long as the refresh token (60 days) instead of one browser session.
const store = {
  get(k) { try { return localStorage.getItem('tm_admin_' + k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem('tm_admin_' + k) : localStorage.setItem('tm_admin_' + k, v); } catch {} },
};
// A tab still signed in from when the session lived in sessionStorage keeps it.
try { for (const k of ['access', 'refresh']) { const v = sessionStorage.getItem('tm_admin_' + k); if (v && !store.get(k)) store.set(k, v); sessionStorage.removeItem('tm_admin_' + k); } } catch {}
const $ = (s, el = document) => el.querySelector(s);
// "Login as user": the token is read-only, lasts 15 minutes and has no refresh token (API lib/auth.ts). It goes in the URL
// fragment, which never reaches a server log, and the app keeps it in that tab only (apps/mobile/src/lib/session.web.ts),
// so the admin's own app session in this browser is left alone.
const impersonationUrl = res => `https://tablamigo.hookstep.in/app/#impersonate_token=${encodeURIComponent(res.accessToken)}`;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeImg = u => typeof u === 'string' && /^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)[:/])/.test(u) ? u : '';
const initials = n => (String(n || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2) || '?').toUpperCase();
const inr = paise => '₹' + (Number(paise || 0) / 100).toLocaleString('en-IN', { maximumFractionDigits: 0 });
const n = v => Number(v || 0).toLocaleString('en-IN');
const dt = v => v ? new Date(v).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const dtt = v => v ? new Date(v).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '—';
function ago(v) {
  if (!v) return '—';
  const s = (Date.now() - new Date(v).getTime()) / 1000, f = Math.abs(s), fut = s < 0;
  const t = f < 60 ? 'just now' : f < 3600 ? Math.round(f / 60) + 'm' : f < 86400 ? Math.round(f / 3600) + 'h' : f < 86400 * 60 ? Math.round(f / 86400) + 'd' : dt(v);
  return t === 'just now' || t.includes(' ') ? t : fut ? 'in ' + t : t + ' ago';
}
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
// A photo that fails to load (deleted file, dead host) falls back to the initials circle.
document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName !== 'IMG') return;
  if (img.closest('.pair')) { const d = document.createElement('div'); d.className = 'noimg'; d.textContent = `Couldn't load image`; img.replaceWith(d); return; }
  if (!img.classList.contains('av')) return;
  const d = document.createElement('div'); d.className = 'av av-open'; d.textContent = img.dataset.initials || '?'; img.replaceWith(d);
}, true);
const person = (name, sub, photo) => `<div class="person">${safeImg(photo) ? `<img class="av av-open" data-full="${esc(safeImg(photo))}" src="${esc(safeImg(photo))}" data-initials="${esc(initials(name))}" alt="" loading="lazy">` : `<div class="av av-open">${esc(initials(name))}</div>`}<div><b>${esc(name || 'No name yet')}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</div></div>`;
// Clicking a picture in the Users list opens it full size; impersonation stays on the explicit button.
function openPhoto(name, src) {
  const lb = document.createElement('div');
  lb.className = 'lightbox'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true'); lb.setAttribute('aria-label', `Photo of ${name || 'user'}`);
  const fig = document.createElement('figure');
  const fallback = () => { const d = document.createElement('div'); d.className = 'nophoto'; d.textContent = 'No photo'; return d; };
  if (src) { const img = document.createElement('img'); img.src = src; img.alt = ''; img.addEventListener('error', () => img.replaceWith(fallback())); fig.appendChild(img); } else fig.appendChild(fallback());
  const cap = document.createElement('figcaption'); cap.textContent = name || 'No name yet'; fig.appendChild(cap);
  lb.appendChild(fig);
  const close = () => { lb.remove(); document.removeEventListener('keydown', onKey, true); };
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  lb.addEventListener('click', e => { if (!e.target.closest('img, .nophoto')) close(); });
  document.addEventListener('keydown', onKey, true);
  document.body.appendChild(lb);
}
const pill = (text, kind = '') => `<span class="pill ${kind}">${esc(text)}</span>`;
// Every person and plan mentioned anywhere opens its drawer: <a data-open-user> / <a data-open-plan>.
const uLink = (id, html) => id ? `<a href="#" class="ulink" data-open-user="${esc(id)}">${html}</a>` : html;
const pLink = (id, html) => id ? `<a href="#" class="plink" data-open-plan="${esc(id)}">${html}</a>` : html;
// A number on the Overview: a link to the list it counts.
const drill = (href, html) => `<a class="drill" href="${esc(href)}">${html}</a>`;
document.addEventListener('click', e => {
  const u = e.target.closest('[data-open-user]'), p = e.target.closest('[data-open-plan]');
  if (!u && !p) return;
  e.preventDefault(); e.stopPropagation();
  if (u) { closeDrawer(); openUser(u.dataset.openUser); } else { closeDrawer(); openPlan(p.dataset.openPlan); }
}, true);

// ---- API -----------------------------------------------------------------------------------------
// The server rotates the refresh token on every use, so parallel 401s share one refresh. If it fails because another tab
// already rotated the token, the stored pair has changed and is used instead of signing out.
let refreshing = null;
function refresh() {
  return refreshing ??= (async () => {
    const rt = store.get('refresh'); if (!rt) return false;
    const r = await fetch(API + '/auth/refresh', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ refreshToken: rt }) }).catch(() => null);
    if (!r || !r.ok) return store.get('refresh') !== rt && !!store.get('refresh');
    const j = await r.json(); store.set('access', j.accessToken); store.set('refresh', j.refreshToken); return true;
  })().finally(() => { refreshing = null; });
}
async function api(path, { method = 'GET', body } = {}, retried) {
  const r = await fetch(API + path, { method, headers: { authorization: 'Bearer ' + store.get('access'), ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401 && !retried && await refresh()) return api(path, { method, body }, true);
  if (r.status === 401) { signOut(); throw new Error('Signed out'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.message || j.error || 'HTTP ' + r.status), { status: r.status });
  return j;
}
const post = (path, body) => api(path, { method: 'POST', body: body || {} });

// ---- sign in -------------------------------------------------------------------------------------
function signOut() { store.set('access', null); store.set('refresh', null); showLogin(); }
function showLogin(msg) {
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#f-email').classList.remove('hidden'); $('#f-code').classList.add('hidden'); $('#login-err').textContent = msg || '';
}
$('#f-email').addEventListener('submit', async e => {

function barChart(rows) {
  const W = 640, H = 170, pad = { l: 28, r: 6, t: 10, b: 24 };
  const max = Math.max(1, ...rows.map(r => r.signups)), step = (W - pad.l - pad.r) / rows.length, bw = Math.max(2, step * .68);
  const nice = max <= 4 ? max : Math.ceil(max / 4) * 4;
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - v / nice);
  const grid = [0, .5, 1].map(f => { const v = Math.round(nice * f); return `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#EFEFEA"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#6E6E68">${v}</text>`; }).join('');
  const bars = rows.map((r, i) => {
    const x = pad.l + i * step + (step - bw) / 2, h = (H - pad.t - pad.b) * (r.signups / nice);
    const d = new Date(r.day + 'T00:00:00');
    const label = i % 5 === 4 || i === rows.length - 1 ? `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#6E6E68">${d.getDate()} ${d.toLocaleString('en', { month: 'short' })}</text>` : '';
    return `<g><a href="#users?day=${esc(r.day)}"><title>${esc(r.day)}: ${r.signups} signups</title><rect x="${x}" y="${y(r.signups)}" width="${bw}" height="${Math.max(h, r.signups ? 2 : 0)}" rx="2" fill="${i === rows.length - 1 ? '#FF5A36' : '#FF8A6E'}"/>${label}</a></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily signups, last 30 days">${grid}${bars}</svg>`;
}

  on('#comp-revoke', () => act(() => api(`/admin/users/${id}/comp`, { method: 'DELETE' }), 'Comp revoked'));

/** "12 min", "3 h", "4 days" (the API's lifespan() in routes/admin.ts). */
const lifespan = (from, to) => { const min = Math.max(0, Math.round((new Date(to) - new Date(from)) / 60000)); return min < 90 ? `${min} min` : min < 2880 ? `${Math.round(min / 60)} h` : `${Math.round(min / 1440)} days`; };
/** Deleted beats banned beats everything: a deleted account is never "Active". */
const userStatus = u => u.deletedAt ? `${pill('Deleted', 'red')} <span class="small">${esc(dtt(u.deletedAt))} · ${esc(lifespan(u.createdAt, u.deletedAt))} after signing up</span>`
  : u.bannedAt ? pill('Banned ' + dt(u.bannedAt), 'red') : u.onboarded ? pill('Active', 'teal') : pill('No profile yet');
const section = (title, rows, row) => `<div class="card"><div class="pad" style="padding-bottom:6px"><h2 style="margin:0">${esc(title)} <span class="muted small">${rows.length}</span></h2></div>${rows.length ? `<div class="tablewrap"><table><tbody>${rows.map(row).join('')}</tbody></table></div>` : '<div class="muted small" style="padding:0 18px 14px">None</div>'}</div>`;

        <div style="white-space:pre-wrap;display:inline-block;text-align:left;background:${m.fromHost ? 'var(--teal-bg)' : 'var(--grey-bg)'};border-radius:10px;padding:8px 10px;max-width:100%">${esc(m.body)}</div></div>`).join('')}</div>
      ${closed ? '<div class="muted small" style="margin-top:10px">They declined the message request, so replies would never reach them.</div>' : `<form id="h-reply" style="margin-top:10px"><textarea id="h-body" rows="3" maxlength="2000" required style="width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--line);border-radius:8px" placeholder="Reply as Tablamigo Host (Team)"></textarea>
        <div class="toolbar" style="margin:6px 0 0"><span class="muted small grow">Sent as the Host. Your account is recorded with it.</span><button class="btn primary">Send</button></div></form>`}`;
    const box = $('#h-msgs'); box.scrollTop = box.scrollHeight;
    $('#h-reply')?.addEventListener('submit', async e => {
      e.preventDefault(); const body = $('#h-body').value.trim(); if (!body) return;
      const b = e.submitter; b.disabled = true;
      try { await post(`/admin/host/chats/${id}/messages`, { body }); toast('Sent'); await openThread(id); } catch (err) { toast(err.message, true); } finally { b.disabled = false; }
    });
    loadChats().catch(() => {});
  };
  const loadStarter = async () => {
    const { plans } = await api('/admin/starter-plans');
    $('#h-starter').innerHTML = plans.length ? `<table><thead><tr><th>Plan</th><th>When</th><th>Where</th><th class="num">Real going</th><th>Status</th></tr></thead><tbody>${plans.map(p => `
      <tr><td><b>${esc(p.title)}</b><div class="muted small">${esc(p.cityKey)} · ${esc(p.slot)}</div></td><td class="nowrap">${dtt(p.startsAt)}</td>
      <td class="small">${esc(p.venue)}${p.city ? `<div class="muted">${esc(p.city)}</div>` : ''}</td><td class="num">${n(p.realGoing)}${p.members > p.realGoing ? `<span class="muted"> of ${n(p.members)}</span>` : ''}</td>
      <td>${p.cancelledAt ? pill(`cancelled, ${p.realGoingAtCancel ?? 0} going`, 'red') : p.status !== 'active' ? pill(p.status) : p.goAnnouncedAt ? pill('going ahead', 'teal') : pill('open', 'amber')}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No starter plans yet.</div>';
  };
  // Create plan as Tablamigo team (POST /admin/host/plans). A venue must come from the place search, so its point is real.
  let picked = null;
  $('#np-search').addEventListener('click', async () => {
    const q = $('#np-q').value.trim(); if (q.length < 2) return;
    try {
      const { places } = await api('/admin/host/places?q=' + encodeURIComponent(q));
      const sel = $('#np-places'); sel.style.display = places.length ? '' : 'none'; sel.size = Math.min(places.length, 6) || 1;
      sel.innerHTML = places.map((p, i) => `<option value="${i}">${esc(p.name)}${p.city ? ', ' + esc(p.city) : ''}${p.country ? ' (' + esc(p.country) + ')' : ''}${p.detail ? ' · ' + esc(p.detail) : ''}</option>`).join('');
      sel.onchange = () => { picked = places[+sel.value]; $('#np-picked').textContent = `${picked.name} · ${picked.lat.toFixed(5)}, ${picked.lng.toFixed(5)}`; if (picked.city) $('#np-city').value = picked.city; };
      if (!places.length) toast('No place found', true);
    } catch (e) { toast(e.message, true); }
  });
  $('#h-np').addEventListener('submit', async e => {
    e.preventDefault();
    if (!picked) return toast('Find and pick the venue first', true);
    const max = $('#np-max').value;
    const body = { title: $('#np-title').value.trim(), emoji: $('#np-emoji').value.trim() || '☕', category: $('#np-cat').value, description: $('#np-desc').value.trim(),
      placeName: picked.name, lat: picked.lat, lng: picked.lng, city: $('#np-city').value.trim(), localAt: `${$('#np-date').value}T${$('#np-time').value}`, ...(max ? { maxPeople: +max } : {}) };
    if (!confirm(`List "${body.title}" at ${body.placeName}, ${body.city}, ${body.localAt.replace('T', ' ')} local, as the Tablamigo team?`)) return;
    const b = $('#np-go'); b.disabled = true;
    try { const r = await post('/admin/host/plans', body); $('#np-out').textContent = `Created ${r.id}`; toast('Plan created'); loadStarter().catch(() => {}); }
    catch (err) { toast(err.message, true); } finally { b.disabled = false; }
  });
  $('#h-pf').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      const p = await api('/admin/host/preview?userId=' + encodeURIComponent($('#h-uid').value.trim()));
      const m = p.meta;
      $('#h-preview').innerHTML = `<div class="card pad"><div class="muted small" style="margin-bottom:8px">${p.welcome ? `Welcome ${esc(p.welcome.status)} ${p.welcome.sentAt ? ago(p.welcome.sentAt) : ''}` : p.due ? 'Due a welcome now' : 'Not due a welcome'} · mode ${esc(p.mode)} · city ${esc(m.city || '—')} · ${n(m.plans)} plans · starter ${m.starter ? 'yes' : 'no'} · ${n(m.others)} others this week · ${n(m.chars)} characters</div><div style="white-space:pre-wrap">${esc(p.text)}</div></div>`;
    } catch (err) { toast(err.message, true); }
  });
  await Promise.all([loadChats(), loadStarter()]);
};

// ---- reports -------------------------------------------------------------------------------------

VIEWS.reports = async () => {

      <tr><td>${r.targetUserId ? `<a href="#" data-user="${esc(r.targetUserId)}" style="text-decoration:none;color:inherit">${person(r.targetUserName, r.targetUserEmail, r.targetUserPhoto)}</a>` : `<span class="muted">Target not found</span><div class="muted small">id ${esc(String(r.targetId).slice(0, 13))}</div>`}${r.targetBannedAt ? pill('banned', 'red') : ''}</td>
      <td>${pill(REASON[r.reason] || r.reason, r.reason === 'underage' || r.reason === 'unsafe' ? 'red' : 'amber')}${r.sameTargetOpen ? `<div class="muted small">+${r.sameTargetOpen} more open</div>` : ''}</td>
      <td class="small" style="max-width:340px"><span class="tag">${esc(r.targetType)}</span> ${r.activityTitle ? pLink(r.targetType === 'activity' ? r.targetId : null, esc(r.activityTitle)) : r.messageBody ? `“${esc(r.messageBody.slice(0, 160))}”` : ''}${r.details ? `<div class="muted">${esc(r.details)}</div>` : ''}</td>
      <td class="small">${uLink(r.reporterId, esc(r.reporterName || r.reporterEmail || '—'))}</td><td class="nowrap small">${ago(r.createdAt)}</td>
      <td><div class="actions">${r.status === 'open' ? `<button class="btn sm teal" data-act="resolve" data-id="${esc(r.id)}">Resolve</button><button class="btn sm" data-act="dismiss" data-id="${esc(r.id)}">Dismiss</button>` : `${pill(r.status === 'actioned' ? 'resolved' : r.status)}<button class="btn sm" data-act="reopen" data-id="${esc(r.id)}">Reopen</button>`}</div></td></tr>`).join('')}</tbody></table>` : `<div class="empty">${status === 'open' ? 'Nothing to review.' : 'No reports here.'}</div>`;

      try { await post(`/admin/reports/${b.dataset.id}/${b.dataset.act}`); toast({ resolve: 'Resolved', dismiss: 'Dismissed', reopen: 'Reopened' }[b.dataset.act]); load(); } catch (e) { toast(e.message, true); }

// ---- verifications -------------------------------------------------------------------------------
// Selfies are checked automatically (api lib/verification.ts). This is a read-only log of the outcomes with their
// scores; the buttons only override a decision and are never needed for someone to get verified.
const POSE = { turn_head: 'Head turned to one side', look_up: 'Chin up', two_fingers: 'Two fingers up (old app, pose not checked)', touch_ear: 'Touching an ear (old app, pose not checked)', thumbs_up: 'Thumbs up (old app, pose not checked)' };
const VREASON = { no_face: 'No clear face', several_faces: 'Several faces', profile_photo: 'Profile photo unusable', same_photo: 'Profile photo resubmitted', no_match: "Didn't match", wrong_pose: 'Wrong pose', check_failed: 'Check failed (our side)', admin: 'Rejected by admin' };
const vScores = s => {
  if (!s) return '<span class="muted small">no scores</span>';
  const f = (v, d = 2) => v == null ? '—' : Number(v).toFixed(d);
  return `<span class="small">match <b>${f(s.similarity)}</b> · faces ${s.selfieFaces}/${s.profileFaces} · yaw ${f(s.yaw)} · pitch ${f(s.pitch)} · hash ${s.hashDistance ?? '—'} · ${s.ms ?? '—'} ms</span>`;
};
/** The week in one line. Selfies submitted counts every request, so 0 means nobody sent one (the nudges went out regardless). */
const verifySummary = c => `Last 7 days: ${n(c.submitted ?? (c.approved + c.rejected + c.pending))} selfies submitted (${n(c.approved)} approved · ${n(c.rejected)} rejected · ${n(c.pending)} being checked)`
  + (c.nudges != null ? ` · ${n(c.nudges)} "verify your profile" emails sent` : '');
VIEWS.verifications = async () => {
  let status = ['all', 'approved', 'rejected', 'pending'].includes(hashParams().get('status')) ? hashParams().get('status') : 'all';
  $('#view').innerHTML = `<h1>Verifications</h1>
    <p class="muted lede">Checked automatically in seconds: one face, same person as the profile photo, not the profile photo again, and the asked head pose. Override only if a decision is clearly wrong.</p>
    <div class="toolbar"><select id="v-s">${[['all', 'All outcomes'], ['approved', 'Approved'], ['rejected', 'Rejected'], ['pending', 'Being checked']].map(([v, l]) => `<option value="${v}" ${v === status ? 'selected' : ''}>${l}</option>`).join('')}</select><span class="muted small" id="v-sum"></span></div>
    <div id="v-list"></div>`;
  const load = async () => {
    const { requests, last7Days: c } = await api('/admin/verifications?status=' + status);
    counts.verifications = c.pending; renderTabs('verifications');
    $('#v-sum').textContent = verifySummary(c);
    $('#v-list').innerHTML = requests.length ? `<div class="grid vgrid">${requests.map(r => `
      <div class="card pad">
        ${uLink(r.userId, person(r.name, r.email))}
        <div class="pair">
          <figure>${safeImg(r.photoUrl) ? `<img src="${esc(safeImg(r.photoUrl))}" alt="Profile photo">` : '<div class="noimg">No profile photo</div>'}<figcaption>Profile photo</figcaption></figure>
          <figure>${safeImg(r.selfieUrl) ? `<img src="${esc(safeImg(r.selfieUrl))}" alt="Verification selfie">` : '<div class="noimg">No selfie</div>'}<figcaption>Selfie</figcaption></figure>
        </div>
        <p style="margin:0 0 6px">${r.status === 'approved' ? pill('Approved', 'teal') : r.status === 'rejected' ? pill(VREASON[r.reason] || 'Rejected', 'red') : pill('Being checked', 'amber')}
          ${r.reviewedAt ? `<span class="muted small">overridden by ${esc(r.reviewedByEmail || 'an admin')}</span>` : r.checkedAt ? '<span class="muted small">automatic</span>' : ''}</p>
        <p style="margin:0 0 6px">${vScores(r.scores)}</p>
        <p style="margin:0 0 10px">Asked pose: <b>${esc(POSE[r.pose] || r.pose)}</b><br><span class="muted small">sent ${ago(r.createdAt)} · joined ${dt(r.joinedAt)}</span></p>
        <div class="actions">${r.status !== 'approved' ? `<button class="btn sm teal" data-v="approve" data-id="${esc(r.id)}">Override: approve</button>` : ''}${r.status !== 'rejected' ? `<button class="btn sm danger" data-v="reject" data-id="${esc(r.id)}">Override: reject</button>` : ''}</div>
      </div>`).join('')}</div>` : '<div class="card empty">No verification selfies yet.</div>';
    $('#v-list').querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm(b.dataset.v === 'approve' ? 'Approve this selfie and give the tick?' : 'Reject this selfie and remove the tick?')) return;
      try {
        await post(`/admin/verifications/${b.dataset.id}/${b.dataset.v}`);
        toast(b.dataset.v === 'approve' ? 'Approved: they get an email' : 'Rejected: they get an email');
        await load();
      } catch (e) { toast(e.message, true); }
    }));
  };
  $('#v-s').addEventListener('change', e => { status = e.target.value; load(); });
  await load();
};

  const st = s => { const k = s.replace('SUBSCRIPTION_STATE_', '').toLowerCase().replace(/_/g, ' '); return pill(k, /active|grace/.test(k) ? 'teal' : /hold|paused|pending/.test(k) ? 'amber' : k === 'canceled' ? 'coral' : ''); };

    <div class="card" style="margin-bottom:12px"><div class="pad" style="padding-bottom:6px"><h2>Trip Passes <span class="muted small">${r.passes.length}</span></h2></div>
      ${r.passes.length ? `<div class="tablewrap"><table><thead><tr><th>Person</th><th>Platform</th><th class="num">Amount</th><th>Bought</th><th>Plus until</th><th>Reference</th></tr></thead><tbody>${r.passes.map(p => `
        <tr class="click" data-user="${esc(p.userId)}"><td>${uLink(p.userId, person(p.name, p.email))}</td><td>${esc(PASS_PLATFORM[p.platform] || p.platform)}</td><td class="num">${p.amount ? inr(p.amount) : '<span class="muted">—</span>'}</td>
        <td class="nowrap">${dt(p.createdAt)}</td><td class="nowrap">${p.voidedAt ? pill('refunded', 'red') : dt(p.expiresAt)}</td><td class="small muted">${esc(p.ref)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No passes yet.</div>'}</div>
    <div class="card"><div class="pad" style="padding-bottom:6px"><h2>Comp Plus <span class="muted small">${r.comps.length}</span></h2></div>
      ${r.comps.length ? `<div class="tablewrap"><table><thead><tr><th>Person</th><th>Comp until</th><th>Plus until</th></tr></thead><tbody>${r.comps.map(c => `
        <tr class="click" data-user="${esc(c.userId)}"><td>${uLink(c.userId, person(c.name, c.email))}</td><td class="nowrap">${dt(c.compUntil)}</td><td class="nowrap">${dt(c.plusUntil)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No comps. Grant one from a user\'s page.</div>'}</div>`;
  $('#view').querySelectorAll('tr[data-user]').forEach(tr => tr.addEventListener('click', () => openUser(tr.dataset.user, VIEWS.subscriptions)));

// ---- emails --------------------------------------------------------------------------------------
VIEWS.emails = async () => {
  const hp = hashParams();
  const st = { kind: hp.get('kind') || '', status: hp.get('status') || '', q: hp.get('q') || '', days: hp.get('days') || '' };
  $('#view').innerHTML = `<h1>Email log</h1>${st.days ? `<div class="toolbar"><span class="pill teal">Last ${esc(st.days)} days${st.status ? ', ' + esc(st.status) : ''}</span><a class="btn sm" href="#emails">Clear</a></div>` : ''}<div class="card" style="margin-bottom:12px" id="e-kinds"></div>
    <div class="toolbar"><input class="grow" type="search" id="e-q" placeholder="Search recipient or subject"><select id="e-k"><option value="">All kinds</option></select>
    <select id="e-s"><option value="">Any status</option><option value="sent">Sent</option><option value="failed">Failed</option><option value="pending">Pending</option><option value="skipped">Skipped</option></select></div>
    <div class="card"><div class="tablewrap" id="e-table"></div></div>`;
  let kindsDone = false;
  if (st.status) $('#e-s').value = st.status;
  if (st.q) $('#e-q').value = st.q;
  const load = async () => {
    const qs = new URLSearchParams(); for (const k of ['kind', 'status', 'q', 'days']) if (st[k]) qs.set(k, st[k]);
    const r = await api('/admin/emails?' + qs);
    if (!kindsDone) {
      kindsDone = true;
      $('#e-k').insertAdjacentHTML('beforeend', r.kinds.map(k => `<option value="${esc(k.kind)}" ${k.kind === st.kind ? 'selected' : ''}>${esc(k.kind)}</option>`).join(''));
      $('#e-kinds').innerHTML = r.kinds.length ? `<div class="tablewrap"><table><thead><tr><th>Kind</th><th class="num">Sent, 7 days</th><th class="num">Sent, 30 days</th><th class="num">Failed</th></tr></thead><tbody>${r.kinds.map(k => `<tr><td>${esc(k.kind)}</td><td class="num">${n(k.sent7)}</td><td class="num">${n(k.sent30)}</td><td class="num">${k.failed ? pill(k.failed, 'red') : '0'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No emails sent yet.</div>';
    }
    $('#e-table').innerHTML = r.emails.length ? `<table><thead><tr><th>When</th><th>To</th><th>Subject</th><th>Kind</th><th>Status</th></tr></thead><tbody>${r.emails.map(m => `
      <tr${m.userId ? ` class="click" data-user="${esc(m.userId)}"` : ''}><td class="nowrap small">${dtt(m.createdAt)}</td><td class="small">${uLink(m.userId, esc(m.toEmail || '—'))}</td><td>${esc(m.subject || '')}${m.error ? `<div class="small" style="color:var(--red)">${esc(m.error)}</div>` : ''}</td>
      <td class="small muted">${esc(m.kind)}</td><td>${pill(m.status + (m.attempts > 1 ? ` ×${m.attempts}` : ''), m.status === 'sent' ? 'teal' : m.status === 'failed' ? 'red' : m.status === 'pending' ? 'amber' : '')}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nothing matches.</div>';
    $('#e-table').querySelectorAll('tr[data-user]').forEach(tr => tr.addEventListener('click', () => openUser(tr.dataset.user)));
  };
  let t; $('#e-q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value.trim(); load(); }, 250); });
  $('#e-k').addEventListener('change', e => { st.kind = e.target.value; load(); });
  $('#e-s').addEventListener('change', e => { st.status = e.target.value; load(); });
  await load();
};

boot();

<script>
'use strict';
TABS.push(['tickets', 'Tickets']);
VIEWS.tickets = async () => {
  const st = { status: 'open', q: '' };

    <p class="muted small" style="margin:-6px 0 12px">Every in-app report opens a ticket with a TM- reference. The reporter got an automatic confirmation; replies sent here are emailed from support@. When they answer, it lands in the support@ inbox with the reference in the subject.</p>
    <div class="toolbar"><input class="grow" type="search" id="t-q" placeholder="Search ref (TM-7K2Q), email or text">
    <select id="t-s"><option value="open">Open</option><option value="unanswered">Open, not answered</option><option value="answered">Open, answered</option><option value="closed">Closed</option><option value="all">All</option></select></div>
    <div class="card"><div class="tablewrap" id="t-table"></div></div>`;
  const load = async () => {

      <tr class="click" data-ticket="${esc(t.id)}"><td class="nowrap"><b>${esc(t.ref)}</b></td><td>${uLink(t.userId, person(t.name, t.email))}</td>
      <td>${esc(t.subject)}<div class="small muted">${esc(t.preview)}</div></td>
      <td>${t.status === 'closed' ? pill('closed') : t.answeredAt ? pill('answered', 'teal') : pill('open', 'coral')}</td>
      <td class="nowrap small">${ago(t.createdAt)}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">${st.status === 'open' ? 'No open tickets.' : 'Nothing here.'}</div>`;
    $('#t-table').querySelectorAll('tr[data-ticket]').forEach(tr => tr.addEventListener('click', () => openTicket(tr.dataset.ticket, load)));
  };
  let tm; $('#t-q').addEventListener('input', e => { clearTimeout(tm); tm = setTimeout(() => { st.q = e.target.value.trim(); load(); }, 250); });
  $('#t-s').addEventListener('change', e => { st.status = e.target.value; load(); });
  await load();

  if (linked) openTicket(linked, load);
};

async function openTicket(id, onChange) {
  const d = $('#drawer');
  if (!d.querySelector('.drawer')) {
    d.innerHTML = `<div class="drawer" role="dialog" aria-modal="true" aria-label="Ticket"><div class="panel"><div class="head"><b>Loading…</b><span style="flex:1"></span><button class="btn sm" data-close>Close</button></div></div></div>`;
    d.querySelector('.drawer').addEventListener('click', e => { if (e.target.classList.contains('drawer') || e.target.closest('[data-close]')) closeDrawer(); });
  }
  let r;

  const panel = d.querySelector('.panel');

  panel.querySelector('[data-send]').addEventListener('click', () => {

  panel.querySelector('[data-close-ticket]')?.addEventListener('click', () => act(() => api(`/admin/tickets/${id}/close`, { method: 'POST' }), 'Ticket closed'));
  panel.querySelector('[data-reopen]')?.addEventListener('click', () => act(() => api(`/admin/tickets/${id}/reopen`, { method: 'POST' }), 'Ticket reopened'));
}

<script>
// Phones: every table with a header row is shown as one card per row (CSS: table.stack under 640px). The tables are built as
// HTML strings all over this page, so instead of touching each one, label each cell with its column's header whenever a
// table appears or changes.
function labelTables(root) {
  for (const t of root.querySelectorAll('table')) {
    const heads = [...t.querySelectorAll(':scope > thead th')].map(th => th.textContent.trim());
    if (!heads.length) continue;
    t.classList.add('stack');
    for (const tr of t.querySelectorAll(':scope > tbody > tr')) {
      [...tr.children].forEach((td, i) => { if (!td.hasAttribute('data-label')) td.setAttribute('data-label', heads[i] ?? ''); });
    }
  }
}
labelTables(document);
new MutationObserver(ms => { if (ms.some(m => m.addedNodes.length)) labelTables(document); }).observe(document.body, { childList: true, subtree: true });
</script>

      <b>${esc(affMoney(o.amountMinor, o.currency))}</b> <span class="muted small">${n(o.count)} rows${o.convert ? ' · paid in INR at today\'s rate, from ₹1,000' : o.due ? '' : ' · below the ' + esc(affMoney(o.minimum, o.currency)) + ' minimum'}</span>
      ${o.convert ? `<input name="rate" type="number" step="0.000001" min="0" placeholder="INR per 1 ${esc(o.currency)}" style="width:150px">` : ''}
      <input name="utr" placeholder="UTR / UPI reference" maxlength="40" ${o.due || o.convert ? '' : 'disabled'}> <button class="btn primary" type="submit" disabled>Mark paid</button></form>`).join('') : '<p class="muted">Nothing owed.</p>'}
    <h3>Monthly statement</h3>
    <div class="toolbar"><input type="month" id="aff-month" value="${new Date().toISOString().slice(0, 7)}"><button class="btn sm" data-stmt="csv">Download CSV</button><button class="btn sm" data-stmt="text">Download text</button><span class="muted small">To email to the partner. Customers appear only as references, never names or emails.</span></div>
    <h3>Commissions <span class="muted small">${d.commissions.length}</span></h3>
    ${d.commissions.length ? `<div class="tablewrap"><table><thead><tr><th>When</th><th>Customer</th><th>Charge</th><th class="num">Net</th><th class="num">Commission</th><th>Status</th></tr></thead><tbody>${d.commissions.map(c => `
      <tr><td class="nowrap small">${dt(c.occurredAt)}</td><td class="small">${esc(c.email || '—')}</td><td class="small">${esc(c.provider === 'google_play' ? 'Play' : 'Razorpay')} · ${esc(String(c.product || '').replace('tablamigo_', ''))}${c.amountSource === 'play_list_price' ? ' ' + pill('estimate', 'amber') : ''}</td>
      <td class="num">${esc(affMoney(c.netMinor, c.currency))}</td><td class="num">${esc(affMoney(c.commissionMinor, c.currency))} <span class="muted small">${esc(c.percent)}%</span></td>
      <td>${c.kind === 'clawback' ? pill('clawback', 'red') : pill(c.status, c.status === 'paid' ? 'teal' : c.status === 'void' ? '' : 'amber')}${c.voidReason && c.kind === 'charge' ? ` <span class="small muted">${esc(c.voidReason)}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No commissions yet.</p>'}

    const month = $('#aff-month').value, format = b.dataset.stmt;
    try {
      const r = await fetch(`${API}/admin/affiliates/${encodeURIComponent(id)}/statement?month=${encodeURIComponent(month)}&format=${format}`, { headers: { authorization: 'Bearer ' + store.get('access') } });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || 'HTTP ' + r.status);
      const url = URL.createObjectURL(await r.blob()), link = document.createElement('a');
      link.href = url; link.download = `tablamigo-${a.code}-${month}.${format === 'csv' ? 'csv' : 'txt'}`; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (err) { toast(err.message, true); }
  }));
}
</script>
</body>

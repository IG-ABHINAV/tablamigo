    <!-- react-native-web's recommended reset: full-height root, no body scroll (screens scroll themselves). -->
    <style id="expo-reset">
      html, body { height: 100%; background: #fff; }
      /* Fixed body: the document never scrolls or rubber-bands, so iOS cannot leave the app shifted after the keyboard. */
      body { overflow: hidden; overscroll-behavior: none; position: fixed; left: 0; right: 0; top: 0; margin: 0; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      #root { display: flex; height: 100%; flex: 1; }
      /* lib/viewport.web.ts: while the keyboard (or a panned visual viewport) hides part of the page, the body is exactly the
         visible area. The transform makes RN-web's modal portals (fixed children of body) follow it too. */
      html.vv-fit body { top: var(--app-top, 0px); height: var(--app-h, 100%); transform: translateZ(0); }
      /* Phones: Safari zooms the page into any text field under 16px on focus and leaves it zoomed. */
      @media (pointer: coarse) { input, textarea, select { font-size: 16px !important; } }
    </style>
    <!-- Static first paint while the JS loads; copies the welcome screen's layout (app/(auth)/welcome.tsx). -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; box-sizing: border-box; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); background: linear-gradient(#FFF4EF, #FFFFFF); color: #16161D; font: 15px PlusJakartaSans_400Regular, system-ui, sans-serif; -webkit-font-smoothing: antialiased; transition: opacity .15s; }
      #splash div { margin: 0; }
      /* A centred phone-width column on wide screens, as the welcome screen is; both buttons stop at Google's 400px. */
      #splash .brand, #splash .fill, #splash .bottom { width: 100%; max-width: 432px; align-self: center; }
      #splash .google, #splash a { width: 100%; max-width: 400px; align-self: center; box-sizing: border-box; }
      #splash .brand { font-family: PlusJakartaSans_800ExtraBold, system-ui, sans-serif; font-size: 22px; color: #FF5A36; margin-top: 8px; }
      #splash .fill { flex: 1; margin-top: 24px; }
      #splash .bottom { display: flex; flex-direction: column; gap: 14px; padding-bottom: 16px; }
      #splash h1 { margin: 0; font: 36px/42px PlusJakartaSans_800ExtraBold, system-ui, sans-serif; letter-spacing: -0.6px; }
      #splash p { margin: 0; color: #55556A; font-size: 16px; line-height: 23px; }
      #splash .google { margin-top: 8px; height: 40px; box-sizing: border-box; border: 1px solid #DADCE0; border-radius: 999px; background: #fff; color: #1F1F1F; display: flex; align-items: center; justify-content: center; gap: 10px; font: 500 14px Roboto, Arial, sans-serif; }
      #splash a { height: 54px; border-radius: 999px; background: #FF5A36; color: #fff; display: flex; align-items: center; justify-content: center; font: 16px PlusJakartaSans_700Bold, system-ui, sans-serif; text-decoration: none; }
      #splash small { color: #55556A; font-size: 12px; text-align: center; }
      /* Signed in, or any screen but the welcome one: just the wordmark, centred on white. */
      .shell #splash { background: #fff; align-items: center; justify-content: center; }
      .shell #splash .fill, .shell #splash .bottom { display: none; }
      .shell #splash .brand { margin: 0; font-size: 28px; width: auto; }
    </style>
    <script>
      // Signed-in users (lib/session.web.ts keeps the tokens here) open on the tabs: the API, map tiles and icons come first.
      (function () {
        var signedIn = false;
        try { signedIn = !!localStorage.getItem('tablamigo.tokens'); } catch (e) {}
        var p = location.pathname.replace(/\/+$/, '');
        if (signedIn || (p !== '/app' && p !== '/app/welcome')) document.documentElement.className = 'shell';
        if (!signedIn) return;
        var link = function (rel, href, as) {
          var l = document.createElement('link'); l.rel = rel; l.href = href; l.crossOrigin = ''; if (as) { l.as = as; l.type = 'font/woff2'; } document.head.appendChild(l);
        };
        link('preconnect', 'https://tablamigo-api.hookstep.in');
        link('preconnect', 'https://tiles.openfreemap.org');
        link('preload', '/app/fonts/Ionicons.subset.woff2', 'font');   // tab bar icons
      })();
    </script>

    <div id="splash">

      <div class="bottom">
        <h1>Traveling solo?<br />Never eat alone.</h1>
        <p>Join plans with travelers near you, or post your own. Dinner, drinks, sunsets, surf.</p>
        <div class="google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continue with Google</div>
        <a href="/app/email">Continue with email</a>

    <div id="root"></div>
    <script>
      // Hand over to the app once its first screen has painted text.
      (function () {
        var root = document.getElementById('root'), splash = document.getElementById('splash');
        var mo = new MutationObserver(function () {
          if (!root.textContent.trim()) return;
          mo.disconnect();
          requestAnimationFrame(function () { requestAnimationFrame(function () {
            splash.style.opacity = '0';
            setTimeout(function () { splash.remove(); }, 200);
          }); });
        });
        mo.observe(root, { childList: true, subtree: true, characterData: true });
      })();
    </script>
    <script>
      // Cloudflare Web Analytics, the same site token and loader as the marketing site (apps/web/build.py, BEACON_JS), with
      // spa:true because screens here change without a page load. Cloudflare's automatic injection would otherwise put its
      // beacon in the critical path of every page; this loads it after the window's load event and an idle moment, and only when
      // no beacon script is on the page already, so nothing is counted twice while automatic injection is still on. Production
      // host only: local runs and e2e-web must not send anything (and would log CORS errors the browser pass fails on).
      (function () {
        try {
          if (location.hostname !== 'tablamigo.hookstep.in') return;
          var add = function () {
            if (document.querySelector('script[src*="cloudflareinsights.com/beacon"]')) return;
            var s = document.createElement('script');
            s.defer = true; s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
            s.setAttribute('data-cf-beacon', '{"token":"88c7787047e04bab8a994b5bb649e9a1","spa":true}');
            document.head.appendChild(s);
          };
          var idle = function () { if (window.requestIdleCallback) requestIdleCallback(add, { timeout: 5000 }); else setTimeout(add, 1500); };
          if (document.readyState === 'complete') idle(); else addEventListener('load', idle, { once: true });
        } catch (e) {}
      })();
    </script>

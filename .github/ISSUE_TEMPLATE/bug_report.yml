name: Bug report
description: Something in the API, the app or the website does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please search the existing issues first. If this is a security problem, do not file it here: see SECURITY.md and email support@hookstep.in.
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - API (apps/api)
        - Mobile / web app (apps/mobile)
        - Website (apps/web)
        - Docs or tooling
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser or phone and OS version, Node version if you ran the API, and the commit you are on.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove emails, tokens and any other personal data before pasting.
